<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeTalk</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0f;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    /* WEBSITE */

    .website {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    .website h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .website p {
      color: #8f8f98;
      line-height: 1.5;
      max-width: 400px;
    }

    #installBtn {
      margin-top: 20px;
      padding: 14px 22px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-size: 15px;
      cursor: pointer;
    }


    /* APP */

    .app {
      max-width: 600px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 18px 20px;
      border-bottom: 1px solid #222228;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      color: #8f8f98;
    }

    .chat {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    .empty-state h2 {
      margin-bottom: 10px;
      font-size: 22px;
    }

    .empty-state p {
      margin: 6px 0;
      color: #8f8f98;
      line-height: 1.5;
    }

    .input-area {
      padding: 14px;
      border-top: 1px solid #222228;
    }

    .message-box {
      display: flex;
      gap: 8px;
    }

    .message-box input {
      flex: 1;
      padding: 14px;
      border: 1px solid #292930;
      border-radius: 14px;
      background: #15151b;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .message-box button {
      width: 48px;
      border: none;
      border-radius: 14px;
      background: white;
      color: black;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- WEBSITE UI -->

  <div class="website" id="websiteUI">
    <h1>FreeTalk</h1>

    <p>
      Talk to people nearby without relying on the internet.
    </p>

    <button id="installBtn">
      Install FreeTalk
    </button>
  </div>


  <!-- PWA UI -->

  <div class="app" id="appUI" style="display: none;">

    <header class="header">
      <div class="logo">FreeTalk</div>
      <div class="status">● OFFLINE</div>
    </header>

    <main class="chat">
      <div class="empty-state">
        <h2>No chats yet</h2>
        <p>
          Find someone nearby<br>
          to start talking.
        </p>
      </div>
    </main>

    <div class="input-area">
      <div class="message-box">
        <input type="text" placeholder="Message...">
        <button>➤</button>
      </div>
    </div>

  </div>


  <script>

    // Check whether FreeTalk is running as an installed PWA

    const isApp =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;


    const websiteUI = document.getElementById("websiteUI");
    const appUI = document.getElementById("appUI");


    if (isApp) {

      // Installed PWA → show chat UI

      websiteUI.style.display = "none";
      appUI.style.display = "flex";

    } else {

      // Normal browser → show website UI

      websiteUI.style.display = "flex";
      appUI.style.display = "none";

    }


    // PWA installation

    const installBtn = document.getElementById("installBtn");

    let deferredPrompt;

    window.addEventListener("beforeinstallprompt", (event) => {

      event.preventDefault();

      deferredPrompt = event;

      console.log("PWA installation is available!");

    });


    installBtn.addEventListener("click", async () => {

      if (!deferredPrompt) {

        console.log("PWA installation is not available yet.");

        return;

      }

      deferredPrompt.prompt();

      const { outcome } = await deferredPrompt.userChoice;

      console.log("Installation choice:", outcome);

      deferredPrompt = null;

    });


    // Service Worker

    if ("serviceWorker" in navigator) {

      navigator.serviceWorker.register("sw.js")
        .then(() => console.log("Service worker registered"));

    }

  </script>

</body>
</html>
